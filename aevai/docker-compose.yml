# Local copy of komodo-config/internal/interns, running this fork's frontend.
# Same services/versions as online, minus cloudflared (tunnel) and backup (S3).
# Rebuild after changes: docker compose up -d --build   (same aevai/Dockerfile as the komodo interns stack)
name: argilla-local

x-argilla-env: &argilla-env
  ARGILLA_HOME_PATH: /var/lib/argilla
  ARGILLA_ELASTICSEARCH: http://elasticsearch:9200
  ARGILLA_DATABASE_URL: postgresql+asyncpg://argilla:${POSTGRES_PASSWORD}@postgres:5432/argilla
  ARGILLA_REDIS_URL: redis://redis:6379/0
  HF_HUB_DISABLE_TELEMETRY: "1"

services:
  argilla:
    image: aevai/argilla-server:local
    build:
      context: ..
      dockerfile: aevai/Dockerfile
    restart: unless-stopped
    environment:
      <<: *argilla-env
      USERNAME: ${ARGILLA_OWNER_USERNAME}
      PASSWORD: ${ARGILLA_OWNER_PASSWORD}
      API_KEY: ${ARGILLA_OWNER_API_KEY}
      WORKSPACE: default
    ports:
      - "127.0.0.1:6900:6900"
    volumes:
      - argilla-data:/var/lib/argilla
    depends_on: [postgres, elasticsearch, redis]

  worker:
    image: aevai/argilla-server:local
    restart: unless-stopped
    environment:
      <<: *argilla-env
      BACKGROUND_NUM_WORKERS: 2
    command: sh -c 'python -m argilla_server worker --num-workers $${BACKGROUND_NUM_WORKERS}'
    depends_on: [postgres, elasticsearch, redis]

  postgres:
    image: postgres:14
    restart: unless-stopped
    environment:
      POSTGRES_USER: argilla
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: argilla
    volumes:
      - postgres-data:/var/lib/postgresql/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    restart: unless-stopped
    environment:
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - node.name=elasticsearch
      - cluster.name=es-argilla
      - discovery.type=single-node
      - cluster.routing.allocation.disk.threshold_enabled=false
      - xpack.security.enabled=false
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes:
      - elastic-data:/usr/share/elasticsearch/data

  redis:
    image: redis:7
    restart: unless-stopped

volumes:
  argilla-data:
  postgres-data:
  elastic-data:
